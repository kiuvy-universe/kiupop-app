<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KiuPop — tu tienda online en minutos.">
  <meta name="theme-color" content="#FBF5EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1920" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="KiuPop">
  <meta property="og:description" content="Tu tienda online en minutos.">
  <style>
    html { background: #FBF5EB; }
    @media (prefers-color-scheme: dark) {
      html { background: #1C1920; }
    }
    #app-splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    #app-splash img { border-radius: 25%; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KiuPop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">

  <title>KiuPop</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-splash" aria-hidden="true">
    <img src="icons/Icon-192.png" width="72" height="72" alt="">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('app-splash')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
