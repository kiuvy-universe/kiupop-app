# Extends gitleaks' default rules. Only narrow, documented allowlists here.
[extend]
useDefault = true

[allowlist]
description = "Server-generated product image keys (uuid v4 + extension) are not secrets"
regexes = [
  '''eyJhbGciOiJub25lIn0\.eyJzdWIiOiJ4In0\.x''',
  '''[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.(jpg|png|webp)''',
]
